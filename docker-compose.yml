services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
      - ./backend/.env:/app/.env:ro

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: /op-registry
      VITE_BASE_PATH: /op-registry/
      VITE_ALLOWED_HOSTS: localhost,127.0.0.1,essentialcomplexity.eu
      BACKEND_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend-data:
